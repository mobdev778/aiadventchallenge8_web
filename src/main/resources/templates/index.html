<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Киновед</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #07111f;
            --bg-secondary: #0d1b2f;
            --glass-border: rgba(130, 180, 255, 0.22);
            --text-primary: #f4f8ff;
            --text-secondary: #a9b9d6;
            --accent: #5ee7ff;
            --accent-strong: #7c5cff;
            --shadow: 0 0 30px rgba(94, 231, 255, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Inter", "Segoe UI", sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at top left, rgba(124, 92, 255, 0.22), transparent 32%),
                radial-gradient(circle at top right, rgba(94, 231, 255, 0.18), transparent 28%),
                linear-gradient(145deg, var(--bg-primary), var(--bg-secondary));
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            top: 8%;
            left: 10%;
            background: rgba(124, 92, 255, 0.18);
        }

        body::after {
            right: 8%;
            bottom: 10%;
            background: rgba(94, 231, 255, 0.14);
        }

        .hero {
            position: relative;
            z-index: 1;
            width: min(100%, 760px);
            padding: 56px 44px;
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(20, 34, 58, 0.72), rgba(10, 18, 33, 0.62));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 24px 80px rgba(0, 0, 0, 0.45),
                var(--shadow);
            text-align: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 27px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(94, 231, 255, 0.35), rgba(124, 92, 255, 0.18), transparent 70%);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow:
                0 0 12px rgba(94, 231, 255, 0.45),
                0 0 28px rgba(124, 92, 255, 0.28);
        }

        .subtitle {
            margin: 0 auto 32px;
            max-width: 620px;
            font-size: 1.08rem;
            line-height: 1.75;
            color: var(--text-secondary);
        }

        .question-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .question-input {
            width: min(100%, 560px);
            padding: 18px 22px;
            border: 1px solid rgba(94, 231, 255, 0.22);
            border-radius: 18px;
            background: rgba(7, 17, 31, 0.72);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 0 rgba(94, 231, 255, 0);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }

        .question-input::placeholder {
            color: rgba(169, 185, 214, 0.72);
        }

        .question-input:focus {
            border-color: rgba(94, 231, 255, 0.65);
            box-shadow:
                0 0 0 4px rgba(94, 231, 255, 0.12),
                0 0 24px rgba(94, 231, 255, 0.18);
            transform: translateY(-1px);
        }

        .question-button {
            padding: 16px 34px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #06101d;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 10px 30px rgba(94, 231, 255, 0.22),
                0 0 24px rgba(124, 92, 255, 0.22);
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        .question-button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 14px 34px rgba(94, 231, 255, 0.28),
                0 0 30px rgba(124, 92, 255, 0.28);
            filter: brightness(1.04);
        }

        .question-button:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .hero {
                padding: 40px 22px;
                border-radius: 24px;
            }

            .subtitle {
                font-size: 1rem;
            }

            .question-input {
                padding: 16px 18px;
            }

            .question-button {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
<section class="hero">
    <h1>Киновед</h1>
    <p class="subtitle">
        Привет! Я - киновед, могу напомнить детали из твоего любимого научно-фантастического фильма
        ("Матрица", "Звездные войны"). Введи ниже, что именно ты хочешь узнать и я подскажу.
    </p>
    <form class="question-form" method="post" action="/chats">
        <input
                class="question-input"
                type="text"
                name="question"
                placeholder="Пример: Что Нео и мальчик говорили про ложку в фильме Матрица?"
                aria-label="Поле для вопроса о фильме"
                required
        >
        <button class="question-button" type="submit">Задать вопрос</button>
    </form>
</section>
</body>
</html>
